name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gradino
          POSTGRES_DB: kart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:gradino@localhost:5432/kart
      TEST_DATABASE_URL: postgresql://postgres:gradino@localhost:5432/kart_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # continue-on-error: 66 errori pre-esistenti al 2026-07-09 (unused-vars
      # su file non toccati di recente) — informativo finché non vengono
      # ripuliti, poi va reso un gate bloccante rimuovendo questa riga.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
