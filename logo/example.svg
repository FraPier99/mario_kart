<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <style>
      .outline{fill:none;stroke:#F5F7FA;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
      .road{fill:none;stroke:#2F343C;stroke-width:42;stroke-linecap:round;stroke-linejoin:round}
      .lane{fill:none;stroke:#F5F7FA;stroke-width:6;stroke-linecap:round;stroke-dasharray:10 14}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:78px;font-weight:700;letter-spacing:10px;fill:#F5F7FA}
      .subtitle{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;letter-spacing:8px;fill:#AEB6C2}
    </style>
